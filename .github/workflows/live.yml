name: Site publicat

on:
  schedule:
    - cron: "17 6 * * *" # zilnic
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    name: ${{ matrix.engine }}
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - run: npm ci
      # Instalarea motorului durează de obicei 25–60 s; uneori oglinda Ubuntu încetinește până la ~15 min
      # și jobul era anulat de limita de timp (3 din ultimele 30 de rulări, doar la webkit). Fiecare
      # încercare are limită proprie; descărcările apt întrerupte se reiau, deci reîncercarea e sigură.
      - name: Instalează motorul (cu limită și reîncercări)
        run: |
          printf 'Acquire::Retries "3";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' | sudo tee /etc/apt/apt.conf.d/99-retea >/dev/null
          for i in 1 2 3; do
            if timeout 300 npx playwright install --with-deps ${{ matrix.engine }}; then exit 0; fi
            echo "::warning::încercarea $i de instalare a eșuat sau a depășit 5 minute; reiau"
            sleep 5
          done
          exit 1
      - name: Așteaptă publicarea (la push)
        if: github.event_name == 'push'
        run: sleep 90
      - run: node live-smoke.js ${{ matrix.engine }}
